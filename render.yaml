services:
  - type: web
    name: crafty-rachel
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SMTP_FROM
        value: craftyrachelscalc@gmail.com
      - key: BREVO_API_KEY
        sync: false
