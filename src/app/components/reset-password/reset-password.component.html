<div class="auth-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="CR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback">CR</div>
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <div class="auth-card">
      <div class="card-icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div class="card-heading">
        <h2>Reset Password</h2>
<ng-container *ngIf="email">
          <p>Resetting password for <strong>{{ email }}</strong></p>
        </ng-container>        <ng-container *ngIf="!(email)">
          <p>Enter your new password below.</p>
</ng-container>
      </div>

      <!-- Validating token -->
<ng-container *ngIf="isValidating">
        <div class="validating">
          <span class="spinner-border spinner-border-sm me-2"></span>Validating reset link…
        </div>
</ng-container>

      <!-- Success -->
<ng-container *ngIf="success">
        <div class="alert-success">
          <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
        </div>
        <p class="redirect-note">Redirecting to login in 3 seconds…</p>
</ng-container>

      <!-- Error (invalid token or general error) -->
<ng-container *ngIf="!isValidating && !isTokenValid && !success">
        <div class="alert-error">
          <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
        </div>
        <a routerLink="/forgot-password" class="btn btn-primary w-100 mt-3">
          <i class="bi bi-key me-2"></i>Request New Reset Link
        </a>
        <p class="back-link mt-3"><a routerLink="/login"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></p>
</ng-container>

      <!-- Form -->
<ng-container *ngIf="!isValidating && isTokenValid && !success">
<ng-container *ngIf="error">
          <div class="alert-error">
            <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
          </div>
</ng-container>

        <form (ngSubmit)="onSubmit()" novalidate>
          <div class="field-group">
            <label class="field-label" for="rp-password">New Password</label>
            <div class="password-wrap">
              <input
                id="rp-password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                required>
              <button type="button" class="pw-toggle" (click)="togglePassword()" tabindex="-1">
                <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
              </button>
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="rp-confirm">Confirm New Password</label>
            <div class="password-wrap">
              <input
                id="rp-confirm"
                [type]="showConfirm ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password"
                required>
              <button type="button" class="pw-toggle" (click)="toggleConfirm()" tabindex="-1">
                <i class="bi" [class.bi-eye]="!showConfirm" [class.bi-eye-slash]="showConfirm"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 submit-btn" [disabled]="isLoading">
<ng-container *ngIf="!isLoading">
              <i class="bi bi-check-lg me-2"></i>Reset Password
            </ng-container>            <ng-container *ngIf="!(!isLoading)">
              <span class="spinner-border spinner-border-sm me-2"></span>Resetting…
</ng-container>
          </button>
        </form>

        <p class="back-link"><a routerLink="/login"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></p>
</ng-container>
    </div>
  </div>
</div>
