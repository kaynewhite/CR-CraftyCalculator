<div class="admin-login-page">
  <!-- Background decoration -->
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-wrapper">
    <!-- Brand -->
    <div class="login-brand">
      <div class="brand-logo-wrap">
        <img src="/CRlogo.png" alt="Crafty Rachel" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback" style="display:none">CR</div>
      </div>
      <div>
        <h1 class="brand-title">Crafty Rachel</h1>
        <p class="brand-sub">Administration Portal</p>
      </div>
    </div>

    <!-- Card -->
    <div class="login-card">
      <div class="card-inner">
        <div class="card-top">
          <div class="shield-icon">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h2>Admin Access</h2>
          <p>Restricted to authorized personnel only</p>
        </div>

        <form (ngSubmit)="login()" #adminForm="ngForm" autocomplete="off">
          <!-- Error -->
          @if (error) {
            <div class="alert alert-danger mb-4" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
            </div>
          }

          <div class="field-group">
            <label class="field-label" for="admin-email">
              <i class="bi bi-envelope me-1"></i>Email Address
            </label>
            <input
              id="admin-email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              placeholder="admin@craftyrachel.com"
              [disabled]="isLoading"
              required
              autocomplete="username">
          </div>

          <div class="field-group">
            <label class="field-label" for="admin-password">
              <i class="bi bi-lock me-1"></i>Password
            </label>
            <div class="password-wrap">
              <input
                id="admin-password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                placeholder="••••••••••"
                [disabled]="isLoading"
                required
                autocomplete="current-password">
              <button type="button" class="pw-toggle" (click)="showPassword = !showPassword" tabindex="-1">
                <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg w-100 mt-2"
            [disabled]="isLoading || !adminForm.valid">
            @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-2"></span>Authenticating...
            } @else {
              <i class="bi bi-arrow-right-circle me-2"></i>Sign In to Admin
            }
          </button>
        </form>

        <div class="back-link">
          <a routerLink="/">
            <i class="bi bi-arrow-left me-1"></i>Back to home
          </a>
        </div>
      </div>
    </div>

    <p class="footer-note">&copy; 2026 Crafty Rachel. All rights reserved.</p>
  </div>
</div>
