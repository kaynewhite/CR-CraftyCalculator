<div class="admin-login-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-brand">
      <div class="brand-logo-wrap">
        <img src="/CRlogo.png" alt="Crafty Rachel" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback" style="display:none">CR</div>
      </div>
      <div>
        <h1 class="brand-title">Crafty Rachel</h1>
        <p class="brand-sub">Administration Portal</p>
      </div>
    </div>

    <div class="login-card">
      <div class="card-inner">
        <div class="card-top">
          <div class="shield-icon">
            <i class="bi bi-shield-lock-fill"></i>
          </div>
          <h2>Admin Access</h2>
          <p>Restricted to authorized personnel only</p>
        </div>

<ng-container *ngIf="error">
          <div class="alert alert-danger mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
          </div>
</ng-container>

        <button class="btn btn-primary btn-lg w-100 mt-2" (click)="login()" [disabled]="isLoading">
<ng-container *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Authenticating...
          </ng-container>          <ng-container *ngIf="!(isLoading)">
            <i class="bi bi-arrow-right-circle me-2"></i>Sign In to Admin
</ng-container>
        </button>

        <div class="back-link mt-3">
          <a routerLink="/">
            <i class="bi bi-arrow-left me-1"></i>Back to home
          </a>
        </div>
      </div>
    </div>

    <p class="footer-note">&copy; 2026 Crafty Rachel. All rights reserved.</p>
  </div>
</div>
