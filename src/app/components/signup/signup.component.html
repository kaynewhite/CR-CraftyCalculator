<div class="signup-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="signup-wrapper">
    <div class="signup-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="CR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback" style="display:none">CR</div>
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <div class="signup-card">
      <div class="card-heading">
        <h2>Create your free account</h2>
        <p>Start calculating costs and maximizing profit today</p>
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger mb-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" #signupForm="ngForm" autocomplete="off">
        <div class="field-group">
          <label class="field-label" for="signup-name">
            <i class="bi bi-person me-1"></i>Full Name
          </label>
          <input
            id="signup-name"
            type="text"
            class="form-control"
            name="name"
            [(ngModel)]="name"
            placeholder="Rachel Santos"
            required>
        </div>

        <div class="field-group">
          <label class="field-label" for="signup-email">
            <i class="bi bi-envelope me-1"></i>Email Address
          </label>
          <input
            id="signup-email"
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            required
            email>
        </div>

        <div class="field-group">
          <label class="field-label" for="signup-password">
            <i class="bi bi-lock me-1"></i>Password
          </label>
          <div class="password-wrap">
            <input
              id="signup-password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              name="password"
              [(ngModel)]="password"
              placeholder="Min 6 characters"
              required
              minlength="6">
            <button type="button" class="pw-toggle" (click)="showPassword = !showPassword" tabindex="-1">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="signup-confirm">
            <i class="bi bi-shield-check me-1"></i>Confirm Password
          </label>
          <div class="password-wrap">
            <input
              id="signup-confirm"
              [type]="showConfirm ? 'text' : 'password'"
              class="form-control"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter your password"
              required>
            <button type="button" class="pw-toggle" (click)="showConfirm = !showConfirm" tabindex="-1">
              <i class="bi" [class.bi-eye]="!showConfirm" [class.bi-eye-slash]="showConfirm"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 submit-btn" [disabled]="isLoading || !signupForm.valid">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2"></span>Creating account…
          } @else {
            <i class="bi bi-rocket-takeoff me-2"></i>Create Free Account
          }
        </button>
      </form>

      <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
