<div class="signup-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="signup-wrapper">
    <div class="signup-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="CR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback" style="display:none">CR</div>
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <div class="signup-card">
      <div class="card-heading">
        <h2>Create your free account</h2>
        <p>Sign up window is opening automatically</p>
      </div>

      <div class="clerk-action-area" style="margin-top: 1.5rem;">
        <div class="d-flex justify-content-center mb-3">
          <div class="spinner-border text-brand" style="width:2rem;height:2rem;" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
        </div>
        <p class="text-center" style="color:var(--text-muted);font-size:0.85rem;">
          The sign up window is opening automatically…
        </p>
        <button class="btn btn-primary btn-lg w-100 submit-btn mt-3" (click)="openSignUp()">
          <i class="bi bi-rocket-takeoff me-2"></i>Create Free Account
        </button>
      </div>

      <p class="switch-link mt-3">Already have an account? <a routerLink="/login" style="cursor:pointer">Sign in</a></p>
    </div>
  </div>
</div>
