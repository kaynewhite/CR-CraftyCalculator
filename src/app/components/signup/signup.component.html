<div class="signup-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="signup-wrapper">

    <div class="signup-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="Crafty Rachel" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback">CR</div>
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <!-- STEP 1: Sign Up Form -->
    <div class="signup-card" *ngIf="step === 'signup'">
      <div class="card-heading">
        <h2>Create your free account</h2>
        <p>Start crafting smarter — no credit card needed</p>
      </div>

      <ng-container *ngIf="error">
        <div class="alert-error">
          <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
        </div>
      </ng-container>

      <form (ngSubmit)="onSubmit()" novalidate>
        <div class="field-group">
          <label class="field-label" for="su-name">Full Name</label>
          <input id="su-name" type="text" class="form-control" [(ngModel)]="name" name="name"
            placeholder="Your full name" autocomplete="name" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="su-email">Email Address</label>
          <input id="su-email" type="email" class="form-control" [(ngModel)]="email" name="email"
            placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="field-group">
          <label class="field-label" for="su-password">Password</label>
          <div class="password-wrap">
            <input id="su-password" [type]="showPassword ? 'text' : 'password'" class="form-control"
              [(ngModel)]="password" name="password" placeholder="At least 8 characters"
              autocomplete="new-password" required>
            <button type="button" class="pw-toggle" (click)="togglePassword()" tabindex="-1">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="su-confirm">Confirm Password</label>
          <div class="password-wrap">
            <input id="su-confirm" [type]="showConfirm ? 'text' : 'password'" class="form-control"
              [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter password"
              autocomplete="new-password" required>
            <button type="button" class="pw-toggle" (click)="toggleConfirm()" tabindex="-1">
              <i class="bi" [class.bi-eye]="!showConfirm" [class.bi-eye-slash]="showConfirm"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 submit-btn" [disabled]="isLoading">
          <ng-container *ngIf="!isLoading">
            <i class="bi bi-rocket-takeoff me-2"></i>Create Free Account
          </ng-container>
          <ng-container *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Sending verification code…
          </ng-container>
        </button>
      </form>

      <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>

    <!-- STEP 2: OTP Verification -->
    <div class="signup-card" *ngIf="step === 'verify'">
      <div class="otp-icon">
        <i class="bi bi-envelope-check-fill"></i>
      </div>
      <div class="card-heading" style="text-align:center;">
        <h2>Check your email</h2>
        <p>We sent a 6-digit verification code to<br><strong>{{ email }}</strong></p>
      </div>

      <ng-container *ngIf="error">
        <div class="alert-error">
          <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
        </div>
      </ng-container>

      <form (ngSubmit)="onVerify()" novalidate>
        <div class="field-group">
          <label class="field-label" for="su-otp">Verification Code</label>
          <input id="su-otp" type="text" class="form-control otp-input" [(ngModel)]="otp" name="otp"
            placeholder="Enter 6-digit code" maxlength="6" autocomplete="one-time-code"
            inputmode="numeric" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 submit-btn" [disabled]="isLoading">
          <ng-container *ngIf="!isLoading">
            <i class="bi bi-shield-check me-2"></i>Verify & Create Account
          </ng-container>
          <ng-container *ngIf="isLoading">
            <span class="spinner-border spinner-border-sm me-2"></span>Verifying…
          </ng-container>
        </button>
      </form>

      <div class="otp-footer">
        <p>Didn't receive the code?
          <button class="btn-link-inline" (click)="onResend()" [disabled]="resendCooldown > 0">
            <ng-container *ngIf="resendCooldown > 0">Resend in {{ resendCooldown }}s</ng-container>
            <ng-container *ngIf="resendCooldown === 0">Resend code</ng-container>
          </button>
        </p>
        <p><button class="btn-link-inline" (click)="goBack()">← Back to sign up</button></p>
      </div>
    </div>

  </div>
</div>
