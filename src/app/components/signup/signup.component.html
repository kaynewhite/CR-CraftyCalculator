<div class="signup-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="signup-wrapper">
    <div class="signup-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="CR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <div class="logo-fallback" style="display:none">CR</div>
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <div class="signup-card">
      <div class="card-heading">
        <h2>Create your free account</h2>
        <p>Start calculating costs and maximizing profit today</p>
      </div>

      <div class="clerk-action-area" style="margin-top: 1.5rem;">
        <button class="btn btn-primary btn-lg w-100 submit-btn" (click)="openSignUp()">
          <i class="bi bi-rocket-takeoff me-2"></i>Create Free Account
        </button>
        <p class="mt-3 text-center" style="color: var(--text-muted); font-size: 0.85rem;">
          Secure sign-up powered by Clerk
        </p>
      </div>

      <p class="switch-link">Already have an account? <a (click)="openSignIn()" style="cursor:pointer">Sign in</a></p>
    </div>
  </div>
</div>
