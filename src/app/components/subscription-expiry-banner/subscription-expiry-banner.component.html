<div *ngIf="showBanner" class="subscription-banner" [class.expired]="daysRemaining <= 0">
  <div class="banner-content">
    <div class="banner-icon">
<ng-container *ngIf="daysRemaining > 0">
        <i class="bi bi-exclamation-triangle"></i>
</ng-container>
<ng-container *ngIf="daysRemaining <= 0">
        <i class="bi bi-x-circle"></i>
</ng-container>
    </div>
    <div class="banner-text">
      <strong>
<ng-container *ngIf="daysRemaining > 0">
          ⚠️ Subscription Ending Soon
</ng-container>
<ng-container *ngIf="daysRemaining <= 0">
          🔴 Subscription Expired
</ng-container>
      </strong>
      <p>
<ng-container *ngIf="daysRemaining > 0">
          Your subscription will expire in {{ daysRemaining }} day<span *ngIf="daysRemaining !== 1">s</span>
</ng-container>
<ng-container *ngIf="daysRemaining <= 0">
          Your subscription has expired. Please renew to continue using premium features.
</ng-container>
      </p>
    </div>
    <div class="banner-actions">
      <button class="extend-btn" (click)="extendSubscription()">
        <i class="bi bi-calendar-plus"></i> Extend Now
      </button>
      <button class="close-btn" (click)="closeBanner()">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>
</div>
