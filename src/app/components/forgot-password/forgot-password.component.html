<div class="auth-page">
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="brand-logo">
        <img src="/CRlogo.png" alt="CR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
      </div>
      <span class="brand-name">Crafty Rachel</span>
    </div>

    <div class="auth-card">
      <div class="card-icon">
        <i class="bi bi-key-fill"></i>
      </div>
      <div class="card-heading">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a password reset link.</p>
      </div>

<ng-container *ngIf="success">
        <div class="alert-success">
          <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
        </div>
        <a routerLink="/login" class="btn btn-outline-secondary w-100 mt-3">
          <i class="bi bi-arrow-left me-2"></i>Back to Login
        </a>
</ng-container>

<ng-container *ngIf="!success">
<ng-container *ngIf="error">
          <div class="alert-error">
            <i class="bi bi-exclamation-circle-fill me-2"></i>{{ error }}
          </div>
</ng-container>

        <form (ngSubmit)="onSubmit()" novalidate>
          <div class="field-group">
            <label class="field-label" for="fp-email">Email Address</label>
            <input
              id="fp-email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required>
          </div>

          <button type="submit" class="btn btn-primary w-100 submit-btn" [disabled]="isLoading">
<ng-container *ngIf="!isLoading">
              <i class="bi bi-envelope me-2"></i>Send Reset Link
            </ng-container>            <ng-container *ngIf="!(!isLoading)">
              <span class="spinner-border spinner-border-sm me-2"></span>Submitting…
</ng-container>
          </button>
        </form>

        <p class="back-link"><a routerLink="/login"><i class="bi bi-arrow-left me-1"></i>Back to Login</a></p>
</ng-container>
    </div>
  </div>
</div>
